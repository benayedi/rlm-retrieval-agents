# ═════════════════════════════ Follow-up studies (migrated 2026-11-11) ═════════════════════════════
# Work that changes something around an agent (what each search returns, its prompt) or one of its settings, after
# the results table. Same fields as above, plus:
#   study            the folder under studies/ (or the agent, for runs that only change an agent's setting)
#   control          the ID of the run it is compared with (paired, same questions)
#   judge            the judge of the reported numbers (gpt-4.1, the paper's judge, with the date of the re-judge)
#   superseded_judge an earlier judge whose verdicts are kept in the records but not reported
#   verdicts         where the reported verdicts are (results/follow_up/verdicts/)
#   trajectories     the archive of the per-question records
# Numbers are not stored here: results/follow_up/studies.md copies them from their sources, naming each.
follow_up_defaults:
  judge_qa_gpt41: "gpt-4.1 (Azure deployment gpt-4.1), OFFICIAL_TEMPLATE, 3 votes, majority; unfinished or empty answers wrong; agents/shared/rlm_shared/grading/"
  model_qwen36: "Qwen3.6-35B-A3B-FP8, vLLM on :8030/:8031 (benchmarks/models/serve_qwen36.sh: 262,144 context, 16,384-token output cap), medium effort, SUP_FENCE_TOLERANT=1 SUP_MAX_BLOCKS=5 SUP_PRESENCE_PENALTY=1.5"
  search_policy: "studies/search_policy/src/rerank_proxy.py in front of the retriever: top DEPTH hits, POLICY=novelty drops documents this run already received, POLICY=rerank scores the rest with Qwen3-Reranker-4B against '<full question> / Current search: <query>', returns the agent's k"

