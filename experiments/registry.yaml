# One entry per row of results/original_baselines/Experiments.xlsx produced by this project (paper baselines and the
# OBLIQ oracle are published numbers and not experiments of this repository).
# Numbers are NOT stored here: scripts/docs/make_experiment_docs.py reads them from the workbook and from the audit
# (docs/verification/data/recompute_experiments.json), so the documents cannot drift from the evidence.
#
# effort_sent records what actually reached the model, which is not always what the launcher requested:
# rlm's Azure client drops reasoning_effort unless the azure_sampling or run5d hook is loaded (docs/verification/KNOWN_ISSUES.md K3).

defaults:
  judge_qa: "gpt-4.1 (Azure deployment gpt-4.1, served gpt-4.1-2025-04-14), official BrowseComp-Plus grader template, 3 votes, majority; a question without a completed answer is wrong"
  judge_obliq: "none (NDCG@10 / Recall@10 against the gold qrels, binary relevance; ranking parsed from the answer text)"

experiments:

# ───────────────────────────── BrowseComp-Plus, snippet REPL agent ─────────────────────────────
- id: BCP-9
  sheet: BrowseComp+
  row: 9
  agent: snippet_repl
  benchmark: BrowseComp-Plus (830 questions, 100,195 documents)
  model: gpt-5 (Azure)
  effort_requested: "root high, sub-LLM medium"
  effort_sent: "deployment default for both (no hook loaded; gpt-5 default measured as medium)"
  retriever: Qwen3-Embedding-8B, single-vector dense, FAISS
  budgets: {turns: 100, searches: "no cap", results_per_search: "5 (default; the model may request more)", snippet: "min(2,000 chars, 512 tokens)", timeout: "none", compaction: "off"}
  run_name: rlmfix32
  dates: "2026-09-11 to 2026-09-12 (trajectory timestamps)"
  original_outputs: ["logs/rlmfix32_q*.json", "logs/rlm_traj32/ (deleted; turn counts kept in scripts/workbook/tokmaps)", "logs/bcp_rejudge_gpt41/10.json (gpt-4.1 verdicts)"]
  launcher: agents/snippet_repl/experiments/september/bcp_snip_qwen_embed.sh
  config: agents/snippet_repl/configs/BCP-9.env
  harness_version: "September state of the harness; closest preserved copy: agents/snippet_repl/original/RLM_git_7685538 (commit of 2026-09-22, after the run)"
  question: "How accurate is the snippet REPL agent with GPT-5 when the retriever is a strong dense embedding model?"
  status: complete
  notes: ['Both root and sub-LLM ran at the deployment default effort, not the high/medium the workbook footnote states (KNOWN_ISSUES K3).', 'Ran on an earlier, unpreserved state of the harness; the closest preserved copy is the commit of 2026-09-22.']

