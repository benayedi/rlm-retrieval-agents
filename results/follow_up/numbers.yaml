# Numbers of the follow-up studies, copied from their sources (not recomputed; owner's policy of 2026-11-10).
# One entry per reported value or comparison. `source` names where the number was copied from:
#   EVIDENCE      the thesis evidence ledger, section "RQ4: GPT-4.1 re-judge" (it cites the verdict files listed with it)
#   STATUS        docs/EXPERIMENTS_STATUS.md of the original repository
#   GEPA_PLAN     docs/GEPA_BROWSECOMP_PLAN.md of the original repository
#   BENCHMARKS    docs/DATASET_BENCHMARKS.md of the original repository
#   HANDOFF       docs/HANDOFF.md of the original repository
#   SUMMARY_XLSX  docs/rlm_results_summary.xlsx of the original repository (sheet, row)
#   VERDICTS      results/follow_up/verdicts/ of this repository (the file named)
# `judge` is the judge of that number. Only gpt-4.1 numbers are reported for accuracy; Qwen3.6-judged ones are kept
# with judge "Qwen3.6 (superseded)" or "Qwen3.6 only". scripts/docs/make_follow_up_docs.py renders this file into
# results/follow_up/studies.md and the per-ID documents in docs/experiments/.

SP-1:
  title: "Search policy (novelty + reranker), BrowseComp-Plus, Qwen3.6, all 830"
  rows:
    - {measure: "accuracy, all 830", arm: "67.5 % (0.6747)", control: "58.0 % (0.5795), BCP-29", n: 830, test: "won/lost 147/68, McNemar p 7.1e-8", judge: "gpt-4.1 (re-judged 2026-10-27)", source: "EVIDENCE (67.5 vs 58.0); STATUS §5 (rows 16 -> 17: 0.5795 -> 0.6747, won/lost 147/68, p 7.1e-8); VERDICTS bcp/16.json, bcp/17.json"}
    - {measure: "accuracy, all 830", arm: "0.694", control: "0.610", n: 830, test: "+8.4 points, t 5.05, won/lost 134/64; gold recall 0.51 -> 0.64", judge: "Qwen3.6 (superseded)", source: "HANDOFF §D"}

SP-2:
  title: "Reranker only (no novelty filter), BrowseComp-Plus test200, Qwen3.6"
  rows:
