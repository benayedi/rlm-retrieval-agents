    - {measure: "accuracy, test200", arm: "0.719", control: "0.607", n: 196, test: "+0.112, t 3.33, won/lost 34/12; gold recall 0.496 -> 0.584; novelty + rerank vs rerank only (n 194): +0.010, t 0.33", judge: "Qwen3.6 (superseded)", source: "GEPA_PLAN §7d"}

SP-3:
  title: "Search policy with GPT-5, 100-question pilot (50 previously wrong, 50 previously right)"
  rows:
    - {measure: "previously wrong (50): fixed", arm: "19 (38 %)", control: "re-runs of the GPT-5 document REPL agent fix ~45 % (25-64 %), VAR-2", n: 50, test: "", judge: "gpt-4.1 (2026-10-27)", source: "STATUS §1"}
    - {measure: "previously right (50): broken", arm: "5 (10 %)", control: "re-runs break ~8 % (3-14 %), VAR-2", n: 50, test: "", judge: "gpt-4.1 (2026-10-27)", source: "STATUS §1"}
